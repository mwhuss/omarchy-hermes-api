[package]
name = "hermes-bridge"
version = "1.2.0"
description = "Omarchy menu bar plugin bridge for the Hermes Agent API server"
edition = "2021"

[[bin]]
name = "hermes-bridge"
path = "src/main.rs"

[dependencies]
bytes = "1"
futures-util = "0.3"
libc = "0.2"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
